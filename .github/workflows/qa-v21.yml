name: VANTA V2.1 Approval QA
on:
  push:
    paths:
      - '.github/workflows/qa-v21.yml'
permissions:
  contents: read
jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.54.2 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: Test guarded trade UI
        run: |
          python3 -m http.server 8080 >/tmp/http.log 2>&1 &
          cat > qa.mjs <<'JS'
          import { chromium } from 'playwright';
          const browser=await chromium.launch({headless:true});
          const page=await browser.newPage({viewport:{width:393,height:852},isMobile:true,hasTouch:true});
          const errs=[];page.on('pageerror',e=>errs.push(e.message));
          await page.goto('http://127.0.0.1:8080/?v=21',{waitUntil:'domcontentloaded'});
          await page.locator('#paperMode').tap();
          await page.locator('#walletQuick').tap();
          await page.waitForSelector('#approvalPolicyCard');
          await page.locator('[data-live-policy="guarded"]').tap();
          await page.locator('#liveTokenCA').fill('EKpQGSJtjMFqKZ9KQanSqYXRcF8fBopzLHYxdM65zcjm');
          await page.locator('#liveSwap').tap();
          await page.waitForSelector('#tradeProposal:not(.hidden)');
          const t=await page.locator('#proposalCountdown').textContent();
          if(!t) throw new Error('countdown missing');
          await page.locator('#proposalReject').tap();
          if(!(await page.locator('#tradeProposal').evaluate(el=>el.classList.contains('hidden')))) throw new Error('reject did not close proposal');
          if(errs.length) throw new Error(errs.join(' | '));
          console.log('PASS V2.1 guarded proposal on iPhone touch viewport');
          await browser.close();
          JS
          node qa.mjs
