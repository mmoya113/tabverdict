name: Apply VANTA V2.1
on:
  push:
    paths:
      - '.github/workflows/apply-v21.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inject V2.1 assets
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          if 'v21.css' not in s:
              s=s.replace('</head>','<link rel="stylesheet" href="v21.css?v=21"></head>')
          if 'v21.js' not in s:
              s=s.replace('</body>','<script src="v21.js?v=21"></script></body>')
          p.write_text(s)
          sw=Path('sw.js')
          if sw.exists():
              t=sw.read_text()
              if 'v21.css' not in t:
                  t=t.replace("'style.css'", "'style.css','v21.css','v21.js'")
                  sw.write_text(t)
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html sw.js || true
          git diff --cached --quiet || git commit -m "Enable VANTA V2.1 guarded live proposals"
          git push
