name: Release extension ZIP

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check and package
        run: |
          npm run check
          npm run package
          cd dist
          zip -qr "tabverdict-${GITHUB_REF_NAME}.zip" tabverdict
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "dist/tabverdict-${GITHUB_REF_NAME}.zip" --generate-notes --verify-tag
