name: Bug report
description: Report a reproducible problem in capture, scoring, export or the UI.
title: "[Bug]: "
labels: [bug, needs-triage]
body:
  - type: markdown
    attributes:
      value: Thanks for making TabVerdict more trustworthy. Remove personal data and order identifiers before submitting.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [Product capture, Decision board, Scoring, Import or export, Accessibility, Packaging or install, Other]
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: v0.1.0 or commit SHA
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      placeholder: "1. Open…\n2. Click…\n3. Observe…"
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual result
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and operating system
      placeholder: Chrome 140 on Windows 11
    validations:
      required: true
  - type: textarea
    id: fixture
    attributes:
      label: Anonymized fixture or screenshot
      description: For a store page, include the smallest relevant HTML/JSON-LD fragment and its locale. Do not include checkout or account data.
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues.
          required: true
        - label: I removed private information.
          required: true
