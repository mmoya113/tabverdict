name: Feature proposal
description: Propose one user problem and a focused way to solve it.
title: "[Feature]: "
labels: [enhancement, needs-triage]
body:
  - type: textarea
    id: problem
    attributes:
      label: What decision problem does this solve?
      description: Describe the pain before the interface.
    validations:
      required: true
  - type: textarea
    id: current
    attributes:
      label: What do you do today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Explain inputs, output and failure state. A sketch is welcome.
    validations:
      required: true
  - type: dropdown
    id: network
    attributes:
      label: Does it require a network service or new browser permission?
      options: [No, Yes, Unsure]
    validations:
      required: true
  - type: checkboxes
    id: principles
    attributes:
      label: Product principles
      options:
        - label: The result can remain inspectable rather than a black box.
          required: true
        - label: The feature does not require affiliate tracking.
          required: true
