<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<meta name="theme-color" content="#000000" />
<title>Phantom LARP Kit — Simulación</title>
<style>
:root{--bg:#000;--card:#181818;--card2:#202020;--line:#2a2a2a;--muted:#9a9a9f;--text:#f5f5f7;--purple:#ab9dfd;--green:#58d783;--red:#ff4c54;--blue:#3975e7;--orange:#f29d38;--radius:24px}*{box-sizing:border-box}html,body{margin:0;background:#000;color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,Arial,sans-serif;-webkit-font-smoothing:antialiased}body{min-height:100vh}.app{width:min(100%,900px);margin:0 auto;min-height:100vh;padding:env(safe-area-inset-top) 18px calc(116px + env(safe-area-inset-bottom));overflow:hidden}.top{position:sticky;top:0;z-index:20;background:rgba(0,0,0,.92);backdrop-filter:blur(18px);padding:10px 0 16px;border-bottom:1px solid #121212}.nav{display:flex;align-items:center;gap:10px;overflow-x:auto;scrollbar-width:none}.nav::-webkit-scrollbar{display:none}.brand{flex:0 0 50px;width:50px;height:50px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(145deg,#68d1a0,#fff4b2);box-shadow:0 8px 28px rgba(0,0,0,.35)}.ghost{width:34px;height:34px;border-radius:16px 16px 13px 13px;background:#171719;position:relative;transform:rotate(-11deg)}.ghost:before,.ghost:after{content:"";position:absolute;width:5px;height:5px;border-radius:50%;background:#ab9dfd;top:11px}.ghost:before{left:9px}.ghost:after{right:9px}.ghost i{position:absolute;width:16px;height:4px;border-radius:4px;background:#f7e99f;left:9px;bottom:7px;transform:rotate(12deg)}.pill{flex:0 0 auto;border:0;border-radius:22px;background:#202020;color:#aaa;font-weight:650;font-size:17px;padding:13px 21px;letter-spacing:-.2px}.pill.active{background:var(--purple);color:#111}.simchip{margin-left:auto;flex:0 0 auto;border:1px solid #5f53a8;color:#d6cffd;background:#161322;padding:8px 10px;border-radius:999px;font-size:11px;font-weight:800;letter-spacing:.08em}.account{padding:34px 2px 22px}.account-top{display:flex;align-items:center;justify-content:space-between;gap:12px}.account-name{color:#aaa;font-size:17px;font-weight:700}.edit-all{border:0;background:#1c1c1e;color:#c8c8cc;border-radius:13px;padding:9px 12px;font-weight:700}.balance{font-size:clamp(50px,12vw,76px);line-height:.98;font-weight:800;letter-spacing:-3.5px;margin:17px 0 12px}.subline{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.change{font-weight:750;font-size:18px}.change.pos{color:var(--green)}.change.neg{color:var(--red)}.sol-equivalent{font-size:13px;color:#a6a6ab;background:#151515;border:1px solid #222;padding:6px 9px;border-radius:10px}.section{margin-top:22px}.section-head{display:flex;align-items:center;justify-content:space-between;margin:0 0 12px}.section-title{font-size:27px;line-height:1;font-weight:800;letter-spacing:-.7px}.chev{font-size:32px;color:#aaa;font-weight:300}.cash{height:84px;border-radius:26px;background:linear-gradient(180deg,#1d1d1f,#181818);display:flex;align-items:center;padding:0 22px;border:1px solid #222}.cash-ico{width:44px;height:44px;border-radius:14px;background:#a7a7ad;color:#202024;display:grid;place-items:center;font-weight:900;font-size:24px}.cash label{font-size:20px;font-weight:750;margin-left:18px}.cash b{margin-left:auto;font-size:20px;font-weight:500}.tokens{display:flex;flex-direction:column;gap:9px}.token{width:100%;border:1px solid #222;background:linear-gradient(180deg,#1d1d1f,#181818);border-radius:26px;min-height:96px;padding:14px 16px;display:grid;grid-template-columns:54px 1fr auto;align-items:center;column-gap:13px;color:inherit;text-align:left}.token:active{transform:scale(.993)}.coin{width:50px;height:50px;border-radius:50%;display:grid;place-items:center;font-size:17px;font-weight:900;box-shadow:inset 0 0 0 1px rgba(255,255,255,.08)}.coin.sol{background:linear-gradient(145deg,#a96cff,#35e4c4);color:#0e0e0f}.coin.usdc{background:#3474d6;color:#fff}.coin.bonk{background:#f0a03c;color:#5d2c00}.coin.wif{background:#d8c7b3;color:#231c18}.tok-main strong{display:block;font-size:20px;letter-spacing:-.2px}.tok-main span{display:block;color:#a0a0a4;font-size:16px;margin-top:5px}.tok-side{text-align:right}.tok-side strong{display:block;font-size:19px;font-weight:500}.tok-side span{display:block;font-size:15px;margin-top:5px}.mini-pos{color:var(--green)}.mini-neg{color:var(--red)}.perps{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(150px,1fr);overflow-x:auto;gap:10px;scrollbar-width:none}.perps::-webkit-scrollbar{display:none}.perp{border:1px solid #222;background:linear-gradient(180deg,#1d1d1f,#181818);border-radius:26px;padding:18px 16px;min-height:150px}.perp-icon{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;font-size:25px;font-weight:900;margin-bottom:18px}.btc{background:#f29d38}.eth{background:#e6e6e8;color:#25252a}.solc{background:linear-gradient(145deg,#9367ff,#24d8ba);color:#111}.perp b{font-size:19px}.lev{font-size:13px;background:#2a2a2c;padding:5px 7px;border-radius:7px;margin-left:5px;color:#e0e0e2}.perp .move{margin-top:12px;font-size:16px;font-weight:700}.pred-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.pred{border:1px solid #222;background:linear-gradient(180deg,#1d1d1f,#181818);border-radius:24px;padding:16px;min-height:120px}.pred small{color:#8e8e93;font-weight:700}.pred strong{display:block;font-size:22px;margin-top:14px}.pred p{margin:8px 0 0;color:#a7a7ab;font-size:13px}.footer-note{margin-top:24px;text-align:center;color:#8d8d93;font-size:12px;letter-spacing:.01em}.bottom{position:fixed;z-index:25;left:50%;transform:translateX(-50%);bottom:0;width:min(900px,100%);padding:12px 18px calc(13px + env(safe-area-inset-bottom));background:linear-gradient(180deg,rgba(0,0,0,0),rgba(0,0,0,.88) 24%,#000 46%)}.warning{font-size:11px;color:#c8c3ea;text-align:center;margin-bottom:8px;font-weight:750}.bottom-row{display:flex;gap:11px;align-items:center}.search{flex:1;height:58px;border-radius:28px;background:rgba(35,35,35,.94);border:1px solid #2d2d2f;display:flex;align-items:center;color:#8c8c90;padding:0 18px;font-size:18px;backdrop-filter:blur(18px)}.mag{font-size:28px;margin-right:10px;line-height:1}.plus{width:58px;height:58px;border-radius:50%;border:0;background:var(--purple);color:#0b0b0d;font-size:39px;font-weight:300;line-height:1}.sheet{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.66);display:none;align-items:flex-end;justify-content:center}.sheet.open{display:flex}.panel{width:min(900px,100%);background:#151515;border:1px solid #2b2b2b;border-radius:28px 28px 0 0;padding:13px 18px calc(24px + env(safe-area-inset-bottom));box-shadow:0 -20px 70px rgba(0,0,0,.6)}.handle{width:42px;height:5px;border-radius:4px;background:#4a4a4d;margin:0 auto 16px}.panel h2{font-size:24px;margin:0 0 16px}.form-grid{display:grid;gap:10px}.field{display:grid;grid-template-columns:1fr 135px;align-items:center;gap:12px;background:#202020;border:1px solid #2c2c2c;border-radius:18px;padding:12px 14px}.field label{font-weight:750}.field input{width:100%;border:0;outline:0;background:#111;color:#fff;border-radius:11px;padding:11px 10px;font-size:16px;text-align:right}.sheet-actions{display:flex;gap:10px;margin-top:14px}.sheet-actions button{flex:1;border:0;border-radius:16px;padding:14px;font-weight:800;font-size:15px}.cancel{background:#28282b;color:#eee}.save{background:var(--purple);color:#121214}.toast{position:fixed;left:50%;transform:translateX(-50%) translateY(20px);bottom:120px;z-index:120;background:#242426;border:1px solid #38383b;color:#fff;border-radius:14px;padding:11px 15px;font-weight:700;font-size:13px;opacity:0;pointer-events:none;transition:.2s}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}@media(min-width:700px){.app{padding-left:30px;padding-right:30px}.pred-grid{grid-template-columns:repeat(4,1fr)}.token{min-height:90px}.perps{grid-auto-columns:220px}}@media(max-width:390px){.pill{padding:11px 17px;font-size:16px}.balance{font-size:54px}.token{grid-template-columns:48px 1fr auto;padding:12px}.coin{width:46px;height:46px}.tok-main strong{font-size:18px}.tok-main span,.tok-side span{font-size:14px}.tok-side strong{font-size:17px}.simchip{display:none}}
</style>
</head>
<body>
<div class="app">
<header class="top">
  <nav class="nav" aria-label="Navegación simulada">
    <div class="brand" aria-label="Logo de simulación"><div class="ghost"><i></i></div></div>
    <button class="pill active">Inicio</button><button class="pill">Operar</button><button class="pill">Predecir</button><button class="pill">Explorar</button>
    <span class="simchip">SIMULADOR</span>
  </nav>
</header>
<main>
  <section class="account">
    <div class="account-top"><div class="account-name">Cuenta 1⌄</div><button class="edit-all" id="editBalances">Editar saldos</button></div>
    <div class="balance" id="portfolioUsd">$8.26</div>
    <div class="subline"><span class="change" id="portfolioChange">$0.00 · 0.00%</span><span class="sol-equivalent" id="portfolioSol">0.000000 SOL</span></div>
  </section>

  <section class="section">
    <div class="cash"><div class="cash-ico">•</div><label>Cash</label><b>$0.00</b></div>
  </section>

  <section class="section">
    <div class="section-head"><div class="section-title">Tokens <span class="chev">›</span></div><button class="edit-all" id="editBalances2">Editar</button></div>
    <div class="tokens" id="tokens"></div>
  </section>

  <section class="section">
    <div class="section-head"><div class="section-title">Perps <span class="chev">›</span></div></div>
    <div class="perps" id="perps"></div>
  </section>

  <section class="section">
    <div class="section-head"><div class="section-title">Predicciones <span class="chev">›</span></div></div>
    <div class="pred-grid" id="predictions"></div>
  </section>
  <div class="footer-note">Datos de mercado: CoinGecko · actualización automática cada 30 s</div>
</main>
</div>

<div class="bottom">
  <div class="warning">Simulación - No usar para engañar</div>
  <div class="bottom-row"><div class="search"><span class="mag">⌕</span>Buscar en la simulación</div><button class="plus" id="plusBtn">+</button></div>
</div>

<div class="sheet" id="sheet" aria-hidden="true">
  <div class="panel">
    <div class="handle"></div>
    <h2>Editar saldos simulados</h2>
    <div class="form-grid" id="balanceFields"></div>
    <div class="sheet-actions"><button class="cancel" id="cancelBtn">Cancelar</button><button class="save" id="saveBtn">Guardar</button></div>
  </div>
</div>
<div class="toast" id="toast">Actualizado</div>
<script>
const assets=[
  {id:'solana',symbol:'SOL',name:'Solana',cls:'sol',default:0},
  {id:'usd-coin',symbol:'USDC',name:'USD Coin',cls:'usdc',default:8.26449},
  {id:'bonk',symbol:'BONK',name:'Bonk',cls:'bonk',default:0},
  {id:'dogwifcoin',symbol:'WIF',name:'dogwifhat',cls:'wif',default:0}
];
const marketIds=['solana','usd-coin','bonk','dogwifcoin','bitcoin','ethereum'];
const iconText={SOL:'S',USDC:'$','BONK':'B',WIF:'W'};
let balances={};
try{balances=JSON.parse(localStorage.getItem('phantom-larp-balances')||'{}')}catch(e){balances={}}
assets.forEach(a=>{if(!Number.isFinite(Number(balances[a.id]))) balances[a.id]=a.default; else balances[a.id]=Number(balances[a.id])});
let prices={};
const $=s=>document.querySelector(s);
const money=n=>new Intl.NumberFormat('en-US',{style:'currency',currency:'USD',maximumFractionDigits:n<1?4:2}).format(Number(n)||0);
const num=n=>{n=Number(n)||0;if(Math.abs(n)>=1000000)return new Intl.NumberFormat('en-US',{notation:'compact',maximumFractionDigits:2}).format(n);if(Math.abs(n)>=1)return n.toLocaleString('en-US',{maximumFractionDigits:6});return n.toLocaleString('en-US',{maximumFractionDigits:8})};
const changeClass=n=>Number(n)>=0?'mini-pos':'mini-neg';
const changeText=n=>`${Number(n)>=0?'+':''}${(Number(n)||0).toFixed(2)}%`;
function render(){
  const list=$('#tokens');list.innerHTML='';
  let total=0,weightedChange=0,weight=0;
  assets.forEach(a=>{
    const p=prices[a.id]?.usd ?? (a.id==='usd-coin'?1:0);
    const ch=prices[a.id]?.usd_24h_change ?? 0;
    const bal=Number(balances[a.id]||0),value=bal*p;
    total+=value;if(value>0){weightedChange+=value*ch;weight+=value}
    const row=document.createElement('button');row.className='token';row.dataset.id=a.id;
    row.innerHTML=`<div class="coin ${a.cls}">${iconText[a.symbol]}</div><div class="tok-main"><strong>${a.symbol}</strong><span>${num(bal)} ${a.symbol}</span></div><div class="tok-side"><strong>${money(value)}</strong><span class="${changeClass(ch)}">${changeText(ch)}</span></div>`;
    row.addEventListener('click',openSheet);list.appendChild(row);
  });
  $('#portfolioUsd').textContent=money(total);
  const pc=weight?weightedChange/weight:0;const changeDollar=total*(pc/100);
  const c=$('#portfolioChange');c.textContent=`${changeDollar>=0?'+':''}${money(changeDollar)} · ${changeText(pc)}`;c.className='change '+(pc>=0?'pos':'neg');
  const solPrice=prices.solana?.usd||0;$('#portfolioSol').textContent=solPrice?`${(total/solPrice).toFixed(6)} SOL`:'— SOL';
  renderPerps();renderPredictions();
}
function renderPerps(){
 const items=[['bitcoin','BTC','40x','₿','btc'],['ethereum','ETH','25x','◆','eth'],['solana','SOL','20x','S','solc']];
 $('#perps').innerHTML=items.map(([id,s,l,ico,cl])=>{const ch=prices[id]?.usd_24h_change??0;return `<article class="perp"><div class="perp-icon ${cl}">${ico}</div><div><b>${s}</b><span class="lev">${l}</span></div><div class="move ${changeClass(ch)}">${changeText(ch)}</div></article>`}).join('');
}
function renderPredictions(){
 const items=[['solana','SOL'],['bitcoin','BTC'],['ethereum','ETH'],['dogwifcoin','WIF']];
 $('#predictions').innerHTML=items.map(([id,s])=>{const p=prices[id]?.usd||0,ch=prices[id]?.usd_24h_change||0;return `<article class="pred"><small>${s} · 24 h</small><strong>${p?money(p):'—'}</strong><p class="${changeClass(ch)}">${changeText(ch)} hoy</p></article>`}).join('');
}
async function fetchPrices(show=false){
  const endpoint=`https://api.coingecko.com/api/v3/simple/price?ids=${marketIds.join(',')}&vs_currencies=usd&include_24hr_change=true`;
  try{const r=await fetch(endpoint,{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);const data=await r.json();prices=data;render();if(show)toast('Precios actualizados')}catch(e){render();if(show)toast('CoinGecko no respondió; se mantienen los últimos datos')}
}
function openSheet(){
 const f=$('#balanceFields');f.innerHTML=assets.map(a=>`<div class="field"><label>${a.name} (${a.symbol})</label><input inputmode="decimal" type="number" step="any" min="0" data-balance="${a.id}" value="${balances[a.id]}"></div>`).join('');
 $('#sheet').classList.add('open');$('#sheet').setAttribute('aria-hidden','false');
}
function closeSheet(){ $('#sheet').classList.remove('open');$('#sheet').setAttribute('aria-hidden','true') }
function saveBalances(){document.querySelectorAll('[data-balance]').forEach(i=>{balances[i.dataset.balance]=Math.max(0,Number(i.value)||0)});localStorage.setItem('phantom-larp-balances',JSON.stringify(balances));render();closeSheet();toast('Saldos simulados guardados')}
let toastTimer;function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),2200)}
$('#editBalances').addEventListener('click',openSheet);$('#editBalances2').addEventListener('click',openSheet);$('#plusBtn').addEventListener('click',openSheet);$('#cancelBtn').addEventListener('click',closeSheet);$('#saveBtn').addEventListener('click',saveBalances);$('#sheet').addEventListener('click',e=>{if(e.target.id==='sheet')closeSheet()});
document.querySelectorAll('.pill').forEach((b,i)=>b.addEventListener('click',()=>{document.querySelectorAll('.pill').forEach(x=>x.classList.remove('active'));b.classList.add('active');if(i!==0)toast('Vista de demostración · sin transacciones reales')}));
render();fetchPrices();setInterval(fetchPrices,30000);
</script>
</body>
</html>
